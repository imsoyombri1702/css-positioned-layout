<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
  <header class="site-header">Techup Chatroom</header>
  <main class="chatroom" aria-label="แชต Techup">
    <section class="message-group message-group--outgoing" aria-label="ข้อความที่ส่ง">
      <div class="message message--green">สวัสดีจ้า</div>
      <div class="message message--gray message--dismissible">
        <span>Coding สนุกจังเลย</span>
        <button class="dismiss-button" type="button" aria-label="ปิดข้อความ">x</button>
      </div>
      <div class="message message--green">🥳 😍</div>
    </section>

    <section class="message-group message-group--incoming" aria-label="ข้อความที่ได้รับ">
      <div class="message message--gray">😍</div>
      <div class="message message--gray">🥳</div>
    </section>
  </main>
</body>

</html>
